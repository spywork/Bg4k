name: Compila e pubblica BG4K

on:
  workflow_dispatch:
    inputs:
      version:
        description: Tag della nuova release (esempio v1.1.0)
        required: true
        default: v1.1.0
      publish:
        description: Pubblica i pacchetti come release GitHub
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            os: windows-2022
            artifact: windows-x86_64
          - name: macOS Apple Silicon
            os: macos-14
            artifact: macos-arm64
          - name: macOS Intel
            os: macos-15-intel
            artifact: macos-x86_64
          - name: Linux x86_64
            os: ubuntu-22.04
            artifact: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Dipendenze Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils
      - name: Installa dipendenze
        run: python -m pip install -r requirements-build.txt
      - name: Compila e prepara il pacchetto
        run: python build.py
      - name: Verifica l'eseguibile nativo
        run: python test_smoke.py
      - name: Conserva pacchetti verificati
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.zip
            release/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Pubblica release
    needs: build
    if: inputs.publish
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Pubblica tutti i sistemi insieme
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Usa un tag come v1.1.0'; exit 1; }
          cd packages
          sha256sum ./*.zip ./*.tar.gz > SHA256SUMS.txt
          cat > release-notes.md <<'EOF'
          BG4K per Windows, macOS e Linux: rimozione dello sfondo offline e PNG trasparente con lato lungo di 3840 pixel.

          - Windows: trascina le foto su BG4K.exe.
          - macOS: scegli arm64 per Apple Silicon, x86_64 per Intel. Estrai l'app in una cartella scrivibile e trascina le foto su BG4K.app.
          - Linux: estrai il tar.gz, esegui Installa_collegamento.sh una volta e usa Apri con BG4K sulle foto; supporta anche gli argomenti da terminale.

          I risultati sono salvati accanto al programma con suffisso _bg4k.png. I nomi di output esistenti vengono sostituiti. Nessuna foto viene inviata online.

          Build native verificate automaticamente per tutti e quattro i pacchetti. Su Mac il test verifica l'eseguibile interno, non il gesto di trascinamento nel Finder. Le app non hanno firma di uno sviluppatore certificato né notarizzazione Apple: il sistema può richiedere di autorizzarne l'apertura iniziale. L'ingrandimento non recupera dettagli assenti e la segmentazione può sbagliare bordi e capelli.
          EOF
          gh release create "$RELEASE_VERSION" ./*.zip ./*.tar.gz SHA256SUMS.txt \
            --target "$TARGET_SHA" --title "BG4K $RELEASE_VERSION — Windows, macOS e Linux" \
            --notes-file release-notes.md --draft
          gh release edit "$RELEASE_VERSION" --draft=false
